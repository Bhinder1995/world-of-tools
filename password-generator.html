<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Strong Password Generator | WorldOfTools</title>
    <meta name="description"
        content="Generate strong, secure passwords instantly. Customize length and character types for maximum security.">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .password-display-container {
            position: relative;
            margin-bottom: 2rem;
        }

        .password-display {
            background: var(--surface-color);
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            padding: 1.5rem;
            font-size: 1.5rem;
            font-family: 'Consolas', monospace;
            word-break: break-all;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .password-display:hover {
            background: #f7fafc;
            border-style: solid;
        }

        .password-display-label {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-color);
            color: white;
            padding: 2px 10px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .strength-meter {
            height: 10px;
            background: #e2e8f0;
            border-radius: 99px;
            margin: 1rem 0;
            overflow: hidden;
            display: flex;
        }

        .strength-bar {
            height: 100%;
            transition: all 0.5s ease;
            width: 0%;
        }

        .strength-weak {
            background: #fc8181;
        }

        .strength-medium {
            background: #f6ad55;
        }

        .strength-strong {
            background: #48bb78;
        }

        .strength-secure {
            background: #38a169;
        }

        .strength-text {
            text-align: center;
            font-weight: 700;
            margin-bottom: 1.5rem;
            min-height: 1.5rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: #f7fafc;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .checkbox-wrapper:hover {
            background: #edf2f7;
        }

        input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        label {
            cursor: pointer;
            font-weight: 500;
            user-select: none;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 10px;
            background: #eef2ff;
            border-radius: 5px;
            outline: none;
            border: 2px solid var(--border-color);
            margin: 1rem 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        }
    </style>

<body>
    <header></header> <!-- Injected by js/common.js -->

    <main class="container">
        <section class="card text-center">
            <h1>🔐 Password Generator</h1>
            <p>Generate secure, random passwords instantly</p>
        </section>

        <section class="card">
            <div class="password-display-container" onclick="copyPassword()">
                <div class="password-display-label">CLICK TO COPY</div>
                <div class="password-display" id="passwordDisplay">Generating...</div>
            </div>

            <div class="strength-meter">
                <div class="strength-bar" id="strengthBar"></div>
            </div>
            <p id="strengthText" class="strength-text"></p>

            <div class="form-group mb-4">
                <label style="display: flex; justify-content: space-between; align-items: center;">
                    <span>Password Length</span>
                    <span id="lengthValue"
                        style="font-weight: bold; background: var(--primary-color); color: white; padding: 2px 8px; border-radius: 4px;">16</span>
                </label>
                <input type="range" id="length" min="6" max="64" value="16"
                    oninput="document.getElementById('lengthValue').textContent = this.value; generatePassword()">
            </div>

            <div class="options-grid">
                <div class="checkbox-wrapper" onclick="toggleCheckbox('uppercase')">
                    <input type="checkbox" id="uppercase" checked
                        onchange="generatePassword(); event.stopPropagation()">
                    <label for="uppercase">Uppercase (A-Z)</label>
                </div>
                <div class="checkbox-wrapper" onclick="toggleCheckbox('lowercase')">
                    <input type="checkbox" id="lowercase" checked
                        onchange="generatePassword(); event.stopPropagation()">
                    <label for="lowercase">Lowercase (a-z)</label>
                </div>
                <div class="checkbox-wrapper" onclick="toggleCheckbox('numbers')">
                    <input type="checkbox" id="numbers" checked onchange="generatePassword(); event.stopPropagation()">
                    <label for="numbers">Numbers (0-9)</label>
                </div>
                <div class="checkbox-wrapper" onclick="toggleCheckbox('symbols')">
                    <input type="checkbox" id="symbols" checked onchange="generatePassword(); event.stopPropagation()">
                    <label for="symbols">Symbols (!@#$)</label>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="generatePassword()" style="flex: 2;">🔄 Generate New
                    Password</button>
                <button class="btn btn-outline" onclick="copyPassword()" style="flex: 1;">📋 Copy</button>
            </div>
        </section>
    </main>

    <footer></footer> <!-- Injected by js/common.js -->

    <script src="js/common.js"></script>
    <script>
        function toggleCheckbox(id) {
            const checkbox = document.getElementById(id);
            // Only toggle if the click wasn't on the checkbox itself (to avoid double toggle)
            if (event.target !== checkbox) {
                checkbox.checked = !checkbox.checked;
                generatePassword();
            }
        }

        function generatePassword() {
            const length = parseInt(document.getElementById('length').value);
            const useUpper = document.getElementById('uppercase').checked;
            const useLower = document.getElementById('lowercase').checked;
            const useNumbers = document.getElementById('numbers').checked;
            const useSymbols = document.getElementById('symbols').checked;

            if (!useUpper && !useLower && !useNumbers && !useSymbols) {
                document.getElementById('passwordDisplay').textContent = 'Select at least one option';
                document.getElementById('strengthBar').style.width = '0%';
                document.getElementById('strengthText').textContent = '';
                return;
            }

            let charset = '';
            if (useUpper) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (useLower) charset += 'abcdefghijklmnopqrstuvwxyz';
            if (useNumbers) charset += '0123456789';
            if (useSymbols) charset += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            let password = '';
            // Ensure at least one of each selected type is included
            if (useUpper) password += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt(Math.floor(Math.random() * 26));
            if (useLower) password += 'abcdefghijklmnopqrstuvwxyz'.charAt(Math.floor(Math.random() * 26));
            if (useNumbers) password += '0123456789'.charAt(Math.floor(Math.random() * 10));
            if (useSymbols) password += '!@#$%^&*()_+-=[]{}|;:,.<>?'.charAt(Math.floor(Math.random() * 28));

            // Fill the rest
            while (password.length < length) {
                password += charset.charAt(Math.floor(Math.random() * charset.length));
            }

            // Shuffle the password
            password = password.split('').sort(() => 0.5 - Math.random()).join('');

            document.getElementById('passwordDisplay').textContent = password;
            updateStrength(password, length);
        }

        function updateStrength(password, length) {
            let score = 0;
            if (length >= 8) score++;
            if (length >= 12) score++;
            if (length >= 16) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            // Cap score at 5 (0-5 scale)
            // 0-1: Weak
            // 2-3: Medium
            // 4: Strong
            // 5+: Very Secure

            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');

            // Reset classes
            bar.className = 'strength-bar';

            let width = 0;
            let colorClass = '';
            let label = '';

            if (score <= 2) {
                width = 33;
                colorClass = 'strength-weak';
                label = 'Weak';
                text.style.color = '#fc8181';
            } else if (score <= 4) {
                width = 66;
                colorClass = 'strength-medium';
                label = 'Medium';
                text.style.color = '#f6ad55';
            } else {
                width = 100;
                colorClass = score >= 6 ? 'strength-secure' : 'strength-strong';
                label = score >= 6 ? 'Very Secure' : 'Strong';
                text.style.color = '#48bb78';
            }

            bar.style.width = width + '%';
            bar.classList.add(colorClass);
            text.textContent = label;
        }

        function copyPassword() {
            const password = document.getElementById('passwordDisplay').textContent;
            if (password === 'Select at least one option' || password === 'Generating...') return;

            navigator.clipboard.writeText(password);

            const label = document.querySelector('.password-display-label');
            const originalText = label.textContent;
            label.textContent = 'COPIED!';
            label.style.background = '#48bb78';

            setTimeout(() => {
                label.textContent = originalText;
                label.style.background = 'var(--primary-color)';
            }, 1500);
        }

        // Generate on load
        window.onload = generatePassword;
    </script>
</body>

</html>
