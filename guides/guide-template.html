<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Ezoic CMP and Header Scripts -->
    <script data-cfasync="false" src="https://cmp.gatekeeperconsent.com/min.js"></script>
    <script data-cfasync="false" src="https://the.gatekeeperconsent.com/cmp.min.js"></script>
    <script async src="//www.ezojs.com/ezoic/sa.min.js"></script>
    <script>
        window.ezstandalone = window.ezstandalone || {};
        ezstandalone.cmd = ezstandalone.cmd || [];
    </script>
    <script src="//ezoicanalytics.com/analytics.js"></script>
    <!-- End Ezoic Scripts -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | WorldOfTools Guide</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="keywords" content="{{KEYWORDS}}">
    <link rel="canonical" href="https://worldoftools.in/guides/{{SLUG}}" />
    <link rel="stylesheet" href="/css/style.css?v=1.7">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <style>
        .guide-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            line-height: 1.8;
            color: #374151;
        }

        .guide-header {
            text-align: center;
            margin-bottom:  2rem;
        }

        .guide-header h1 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            margin-bottom:  0.75rem;
            color: #111827;
        }

        .guide-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(79, 70, 229, 0.08);
            color: var(--primary-color);
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom:  1rem;
            border: 1px solid rgba(79, 70, 229, 0.1);
        }

        .back-to-tool {
            display: flex;
            justify-content: center;
            margin-bottom:  1.5rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--primary-gradient);
            color: white;
            padding: 1rem 2rem;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .back-btn:hover {
            transform: translateY(-2px);
        }

        .guide-content h2 {
            font-size: 1.75rem;
            font-weight: 800;
            margin: 3rem 0 1.5rem;
            color: #111827;
            letter-spacing: -0.02em;
        }

        .guide-content p {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }

        .guide-content ul, .guide-content ol {
            margin-bottom: 2rem;
            padding-left: 1.5rem;
        }

        .guide-content li {
            margin-bottom: 0.75rem;
        }

        .info-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 2rem;
            margin: 2.5rem 0;
        }

        .faq-section {
            margin-top: 5rem;
        }

        .faq-item {
            border-bottom: 1px solid #e5e7eb;
            padding: 1.5rem 0;
        }

        .faq-question {
            font-weight: 800;
            font-size: 1.1rem;
            color: #111827;
            margin-bottom: 0.5rem;
        }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CCYN1G2F05"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-CCYN1G2F05');
    </script>
</head>

<body>
    <header></header>

    <main class="container">
        <article class="guide-container">
            <header class="guide-header">
                <div class="guide-badge">📖 Official User Guide</div>
                <h1>{{H1}}</h1>
                <p style="font-size: 1.1rem; color: #6b7280; max-width: 700px; margin: 0 auto;">
                    {{SUBTITLE}}
                </p>
            </header>

            <div class="back-to-tool">
                <a href="/{{TOOL_URL}}" class="back-btn">
                    <span>⚡ Use This Tool Now</span>
                </a>
            </div>

            <div class="guide-content">
                {{CONTENT}}
            </div>

            <div class="back-to-tool" style="margin-top: 5rem;">
                <a href="/{{TOOL_URL}}" class="back-btn">
                    <span>🚀 Launch {{TOOL_NAME}}</span>
                </a>
            </div>
        </article>
    </main>

    <footer></footer>

    <script src="/js/common.js?v=1.7"></script>
</body>

</html>
