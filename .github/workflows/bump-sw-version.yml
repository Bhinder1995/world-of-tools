name: Bump Service Worker Version

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bump Service Worker Cache Name
        run: |
          python -c "
          import re, os
          with open('service-worker.js', 'r', encoding='utf-8') as f:
              content = f.read()
          new_ver = 'worldoftools-v' + os.environ['GITHUB_RUN_NUMBER']
          content = re.sub(r\"const CACHE_NAME = '[^']+'\", f\"const CACHE_NAME = '{new_ver}'\", content)
          with open('service-worker.js', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add service-worker.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: bump service worker version [skip ci]" && git push)
