<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Contact Us — WorldOfTools | Support & Feedback</title>
    <meta content="Have a question or suggestion for WorldOfTools? Reach out to our team for support, tool requests, or feedback." name="description"/>
    
    <!-- SEO Optimization Meta Tags -->
    <link rel="canonical" href="https://worldoftools.in/contact-us">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="WorldOfTools.in">
    <meta property="og:title" content="Contact Us — WorldOfTools">
    <meta property="og:description" content="Get in touch with the WorldOfTools team.">
    <meta property="og:url" content="https://worldoftools.in/contact-us">
    <meta property="og:image" content="https://worldoftools.in/og/worldoftools-banner.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet"/>
    <link href="/css/style.css?v=6.1" rel="stylesheet"/>
    <link href="/css/neo-brutalism.css?v=6.1" rel="stylesheet"/>
    
    <style>
        :root {
            --nb-yellow: #ffe066;
            --nb-pink: #ff6b9d;
            --nb-mint: #b2f5ea;
            --nb-blue: #a3bffa;
            --nb-border: 2.5px solid #000;
        }
        body { font-family: 'Space Grotesk', sans-serif; background: #fafaf8; }
        .contact-container { max-width: 900px; margin: 4rem auto; padding: 0 1.5rem; display: grid; grid-template-columns: 1fr 1.5fr; gap: 3rem; }
        @media(max-width: 768px) { .contact-container { grid-template-columns: 1fr; } }
        
        .contact-info h1 { font-family: 'Syne', sans-serif; font-size: 3rem; font-weight: 900; line-height: 1; margin-bottom: 1.5rem; }
        .info-card { 
            background: var(--nb-mint); border: var(--nb-border); border-radius: 16px; 
            padding: 1.5rem; box-shadow: 4px 4px 0 #000; margin-bottom: 1.5rem;
        }
        .info-card h3 { font-weight: 800; margin-bottom: 0.5rem; font-size: 1.2rem; }
        
        .contact-form { 
            background: #fff; border: var(--nb-border); border-radius: 24px; 
            padding: 2.5rem; box-shadow: 8px 8px 0 #000;
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 800; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 0.5rem; }
        .form-input { 
            width: 100%; padding: 1rem; border: var(--nb-border); border-radius: 12px; 
            font-family: inherit; font-size: 1rem; outline: none; background: #fff;
            transition: box-shadow 0.2s;
        }
        .form-input:focus { box-shadow: 4px 4px 0 var(--nb-yellow); }
        textarea.form-input { height: 150px; resize: none; }
    </style>
</head>
<body>
    <header></header>
    
    <main class="contact-container">
        <div class="contact-info">
            <div class="hero-badge" style="background:var(--nb-yellow); border:var(--nb-border); border-radius:99px; padding:0.3rem 1rem; font-weight:800; margin-bottom:1rem; box-shadow:2px 2px 0 #000; font-size:0.75rem;">GET IN TOUCH</div>
            <h1>Let's Talk.</h1>
            <p style="font-size:1.1rem; color:#555; margin-bottom:2rem;">Have a bug to report? A tool to suggest? Or just want to say hi? We're all ears.</p>
            
            <div class="info-card">
                <h3>Email Us</h3>
                <p>support@worldoftools.in</p>
            </div>
            <div class="info-card" style="background:var(--nb-blue);">
                <h3>Response Time</h3>
                <p>We typically reply within 24-48 hours during weekdays.</p>
            </div>
        </div>

        <div class="contact-form">
            <form action="#" method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-input" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <select class="form-input">
                        <option>Bug Report</option>
                        <option>Tool Suggestion</option>
                        <option>General Feedback</option>
                        <option>Business Inquiry</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Your Message</label>
                    <textarea class="form-input" placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" class="nb-btn nb-btn-primary" style="width:100%; padding:1.2rem; font-size:1.1rem;">Send Message</button>
            </form>
        </div>
    </main>

    <footer></footer>
    <script src="/js/common.js?v=6.1"></script>
</body>
</html>
